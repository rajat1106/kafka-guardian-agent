# Kafka Guardian Agent — full local stack.
#
#   docker compose up --build
#   dashboard  http://localhost:5173
#   api        http://localhost:8080/api/state
#
# To target Confluent Cloud instead of the bundled broker, set the
# KAFKA_* variables in .env and start with:
#   docker compose -f docker-compose.yml -f docker-compose.confluent.yml up

name: kafka-guardian

services:
  # ── Kafka 4.x in KRaft mode. No ZooKeeper: it was removed in Kafka 4.0.
  kafka:
    image: apache/kafka:4.1.0
    container_name: kga-kafka
    ports:
      - "19092:19092"        # host access (host.docker.internal-free)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: kga-cluster-0000000000
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: kga-postgres
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
      POSTGRES_DB: guardian
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ── The policy engine. Every mutating action is evaluated here.
  opa:
    image: openpolicyagent/opa:1.4.2
    container_name: kga-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=error"
      - "/policy"
    volumes:
      - ./policy:/policy:ro
    ports:
      - "8181:8181"

  fleet:
    build: {context: ., dockerfile: Dockerfile.python}
    container_name: kga-fleet
    working_dir: /app/services/fleet
    command: python main.py
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports: ["8081:8081"]
    depends_on:
      kafka: {condition: service_healthy}

  detector:
    build: {context: ., dockerfile: Dockerfile.python}
    container_name: kga-detector
    working_dir: /app/services/detector
    command: python main.py
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    ports: ["8084:8084"]
    depends_on:
      kafka: {condition: service_healthy}

  guardian:
    build: {context: ., dockerfile: Dockerfile.python}
    container_name: kga-guardian
    working_dir: /app/services/guardian
    command: python main.py
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      POSTGRES_DSN: postgresql://guardian:guardian@postgres:5432/guardian
      OPA_URL: http://opa:8181
      FLEET_URL: http://fleet:8081
    ports: ["8083:8083"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}
      opa: {condition: service_started}

  chaos:
    build: {context: ., dockerfile: Dockerfile.python}
    container_name: kga-chaos
    working_dir: /app/services/chaos
    command: python main.py
    env_file: [.env]
    environment:
      FLEET_URL: http://fleet:8081
    ports: ["8082:8082"]
    depends_on: [fleet]

  api:
    build: {context: ., dockerfile: Dockerfile.python}
    container_name: kga-api
    working_dir: /app/services/api
    command: python main.py
    env_file: [.env]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      FLEET_URL: http://fleet:8081
      CHAOS_URL: http://chaos:8082
      GUARDIAN_URL: http://guardian:8083
      DEMO_BOOTSTRAP: kafka:9092
      POSTGRES_DSN: postgresql://guardian:guardian@postgres:5432/guardian
      DEMO_CONTAINER_PREFIX: kga-
    volumes:
      # Lets the Connections page start/stop the demo cluster and run
      # container-level chaos (pausing the real broker). Scoped in code to
      # containers carrying the kga- prefix. Remove this mount if you only
      # ever point the agent at an external cluster.
      - /var/run/docker.sock:/var/run/docker.sock
    ports: ["8080:8080"]
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  # Standard Kafka console for browsing topics, partitions, messages and
  # consumer groups directly. The Topology page shows the agent's view of the
  # cluster; this is the cluster itself, with no interpretation layered on it.
  # DYNAMIC_CONFIG_ENABLED lets you add your own cluster (including Confluent
  # Cloud) from inside the console without touching this file.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kga-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: demo (kafka-guardian)
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_SERVLET_CONTEXT_PATH: /
    depends_on:
      kafka: {condition: service_healthy}

  web:
    build: {context: ./web, dockerfile: Dockerfile}
    container_name: kga-web
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: ws://localhost:8080/ws
      VITE_KAFKA_UI_URL: http://localhost:8090
    depends_on: [api]

volumes:
  pgdata:
